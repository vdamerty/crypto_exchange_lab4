
services:
  dwh_postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: crypto_lab4
      POSTGRES_USER: crypto_admin
      POSTGRES_PASSWORD: ${DWH_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 20

  metabase:
    image: metabase/metabase:latest
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      dwh_postgres:
        condition: service_healthy

volumes:
  pgdata:
  metabase_data:
